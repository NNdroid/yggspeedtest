name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

  build:
    name: Build ${{ matrix.bin }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        bin: [yggspeedtest, yggspeedtest-web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="v1.0.$(date +'%Y%m%d')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cross compile
        env:
          CGO_ENABLED: '0'
          BIN: ${{ matrix.bin }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # 平台列表与 scripts/build.sh 保持一致: "GOOS/GOARCH/VARIANT"
          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "linux/arm/7"
            "linux/mipsle/softfloat"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          mkdir -p dist
          for PLATFORM in "${PLATFORMS[@]}"; do
            IFS="/" read -r -a PARTS <<< "$PLATFORM"
            OS=${PARTS[0]}
            ARCH=${PARTS[1]}
            VARIANT=${PARTS[2]:-}

            NAME="${BIN}-${OS}-${ARCH}"
            export GOOS=$OS GOARCH=$ARCH
            unset GOARM GOMIPS
            if [ "$ARCH" = "arm" ] && [ -n "$VARIANT" ]; then
              export GOARM=$VARIANT
              NAME="${NAME}v${VARIANT}"
            fi
            if [ "$ARCH" = "mipsle" ] || [ "$ARCH" = "mips" ]; then
              export GOMIPS=$VARIANT
            fi
            if [ "$OS" = "windows" ]; then
              NAME="${NAME}.exe"
            fi

            echo "Building $NAME"
            go build -ldflags="-s -w -X yggspeedtest/internal/engine.Version=$VERSION" \
              -o "dist/${NAME}" "./cmd/${BIN}" || exit 1
          done

      - name: Package
        env:
          BIN: ${{ matrix.bin }}
        run: |
          cd dist
          tar -czvf "../${BIN}-linux.tar.gz" "${BIN}"-linux-*
          tar -czvf "../${BIN}-darwin.tar.gz" "${BIN}"-darwin-*
          zip -r "../${BIN}-windows.zip" "${BIN}"-windows-*
          cd ..
          ls -l *.tar.gz *.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin }}
          # A workflow expression, not ${BIN}: inside a `uses:` block the
          # path is matched literally by the action, so a shell variable from
          # an earlier step never expands here and the upload finds no files.
          path: |
            ${{ matrix.bin }}-linux.tar.gz
            ${{ matrix.bin }}-darwin.tar.gz
            ${{ matrix.bin }}-windows.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Move artifacts for release
        run: |
          mkdir -p release_assets
          find ./artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} ./release_assets/ \;
          ls -la ./release_assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
